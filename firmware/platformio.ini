; ============================================================
;  Automotive CAN Stack — PlatformIO Configuration
;  ESP32-WROOM Dual Core | MCP2515 | ESP-IDF Framework
;
;  Environments:
;    [env:node_a]        Real-car OBD-II poller (DEFAULT for car)
;    [env:node_a_sniff]  Passive HS-CAN sniffer  (listen-only, no TX)
;    [env:node_a_bench]  Bench decoder + UDS test client
;    [env:node_b]        Multi-ECU bench simulator (SPIFFS)
;
;  Switch environments via the PlatformIO env selector or:
;    pio run -e node_a_sniff -t upload
;  NEVER edit source files to switch modes.
; ============================================================

[common]
platform      = espressif32
board         = esp32dev
framework     = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

build_flags =
    -Icomponents/hal/mcp2515
    -Icomponents/can_core/isotp
    -Icomponents/can_core/diagnostic
    -Icomponents/can_core/UDS
    -Icomponents/can_core/dispatcher
    -Icomponents/can_core/signal
    -Icomponents/app/decoder
    -Icomponents/app/GPS
    -Icomponents/app/logger
    -Icomponents/app/sim
    -Icomponents/app/shutdown
    -Icomponents/utils
    -Isrc

; ============================================================
;  Node A — REAL CAR (OBD-II active poller)
;  Role: Polls engine ECU on 0x7DF, decodes 0x7E8 responses.
;        RPM, speed, throttle, load, coolant, intake temp.
; ============================================================
[env:node_a]
extends      = common
upload_port  = COM12
monitor_port = COM12

build_flags =
    ${common.build_flags}
    -DNODE_ROLE=NODE_RECEIVER
    -DNODE_NAME=\"NodeA\"
    -DREAL_CAR_MODE
    -DCAN_BITRATE=500000
    -DMCP2515_OSC_MHZ=8
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SCK_PIN=18
    -DSPI_CS_PIN=5
    -DMCP2515_INT_PIN=4

; ============================================================
;  Node A — PASSIVE SNIFF  (HS-CAN reverse engineering)
;  Role: LISTEN_ONLY — no ACK, no TX, no OBD poller.
;        Every frame captured into 128-ID histogram (health log
;        every 5 s).  Serial output in candump format for
;        tools/can_sniffer.py — pipe with:
;            python tools/can_sniffer.py --port COM12
; ============================================================
[env:node_a_sniff]
extends      = common
upload_port  = COM12
monitor_port = COM12

build_flags =
    ${common.build_flags}
    -DNODE_ROLE=NODE_RECEIVER
    -DNODE_NAME=\"NodeA\"
    -DPASSIVE_SNIFF_MODE
    -DCANDUMP_OUTPUT
    -DCAN_BITRATE=500000
    -DMCP2515_OSC_MHZ=8
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SCK_PIN=18
    -DSPI_CS_PIN=5
    -DMCP2515_INT_PIN=4

; ============================================================
;  Node A — BENCH (with Node B simulator on the other end)
;  Role: Runs Step 13 scorecard, UDS test client, broadcast
;        stream decoders. No OBD poller.
; ============================================================
[env:node_a_bench]
extends      = common
upload_port  = COM12
monitor_port = COM12

build_flags =
    ${common.build_flags}
    -DNODE_ROLE=NODE_RECEIVER
    -DNODE_NAME=\"NodeA\"
    -DCAN_BITRATE=500000
    -DMCP2515_OSC_MHZ=8
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SCK_PIN=18
    -DSPI_CS_PIN=5
    -DMCP2515_INT_PIN=4

; ============================================================
;  Node B — Multi-ECU Bench Simulator (SPIFFS-enabled)
;  Role: Broadcasts proprietary streams + responds to OBD/UDS
;        requests + injects faults per /spiffs/system.json.
; ============================================================
[env:node_b]
extends      = common
upload_port  = COM14
monitor_port = COM14

board_build.filesystem = spiffs
board_build.partitions = partitions.csv

build_flags =
    ${common.build_flags}
    -DNODE_ROLE=NODE_TRANSMITTER
    -DNODE_NAME=\"NodeB\"
    -DCAN_BITRATE=500000
    -DMCP2515_OSC_MHZ=8
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SCK_PIN=18
    -DSPI_CS_PIN=5
    -DMCP2515_INT_PIN=4